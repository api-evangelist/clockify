apis:
- aid: clockify:rest-api
  name: Clockify REST API
  description: >-
    REST API for Clockify providing access to workspaces, users, groups, projects, tasks, clients, tags,
    time entries, reports, webhooks, and approvals. Authentication uses the X-Api-Key request header with
    a key generated from a user's Profile Settings; the API enforces a 10 requests per second per key
    rate limit and regional URL prefixes for EU and other workspaces.
  humanURL: https://docs.clockify.me/
  baseURL: https://api.clockify.me/api/v1
  tags:
