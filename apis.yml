aid: clockify
name: Clockify
description: >-
  Clockify is a time tracking and timesheet platform used by teams to track
  work hours across projects with a timer, manual timesheets, kiosk
  check-in, scheduling, expense tracking, invoicing, and reporting. The
  Clockify REST API exposes workspaces, users, projects, tasks, tags,
  clients, time entries, reports, and webhooks, and authenticates with an
  X-Api-Key header.
type: Index
accessModel:
  pricing: unknown
  onboarding: self-serve
  trial: false
  try_now: false
  public: false
  label: Self-serve signup
  confidence: medium
  source:
  - authentication
  generated: '2026-07-22'
  method: derived
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/clockify.png
tags:
  - Time Tracking
  - Timesheets
  - Productivity
  - Project Management
  - Reporting
  - Invoicing
  - Workforce
